name: Altera Sententia

# Altera Sententia ("the other opinion", in Latin) is a second,
# independent translation-review judge for Verbum, running as a Grok 4.5
# agent via the shared reusable workflow in translation-judge.yml. It
# reviews the exact same diff as Iudex, deliberately using a different
# model family (Iudex defaults to Claude, and sentences are generated by
# Claude too) so the check isn't relying on one lab's model to both write
# and grade the same content. See the "Translation Review Judges" section
# of README.md for details.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: altera-sententia-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  altera-sententia:
    uses: ./.github/workflows/translation-judge.yml
    with:
      agent_name: Altera Sententia
      # Override without editing this file by setting a repo/org Actions
      # variable named ALTERA_SENTENTIA_MODEL (Settings > Secrets and
      # variables > Actions > Variables).
      model: ${{ vars.ALTERA_SENTENTIA_MODEL || 'grok-4.5-high' }}
    secrets: inherit
