name: Iudex

# Iudex ("judge", in Latin) is the primary translation-review judge for
# Verbum, running as a Claude Opus agent via the shared reusable workflow
# in translation-judge.yml. See the "Translation Review Judges" section
# of README.md for details.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: iudex-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  iudex:
    uses: ./.github/workflows/translation-judge.yml
    with:
      agent_name: Iudex
      # Override without editing this file by setting a repo/org Actions
      # variable named IUDEX_MODEL (Settings > Secrets and variables >
      # Actions > Variables).
      model: ${{ vars.IUDEX_MODEL || 'claude-opus-5-thinking-high' }}
    secrets: inherit
